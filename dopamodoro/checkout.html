<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade — Dopamodoro</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    .checkout-wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
    .co-back { display:inline-block; color:var(--text-3); font-size:13px; font-weight:700; margin-bottom:20px; }
    .co-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px; }
    .co-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .co-name { font-size:18px; font-weight:800; }
    .co-price { font-size:26px; font-weight:900; letter-spacing:-.02em; white-space:nowrap; }
    .co-price .per { font-size:14px; font-weight:700; color:var(--text-3); }
    .co-note { font-size:12.5px; color:var(--dopa-2); font-weight:800; margin-top:6px; }
    .co-pay-note { display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; color:var(--text-2); background:rgba(236,72,153,0.08); border:1px solid rgba(236,72,153,0.25); border-radius:10px; padding:11px 16px; text-align:center; margin-bottom:16px; }
    .co-trust { display:flex; justify-content:center; gap:24px; margin-top:28px; flex-wrap:wrap; font-size:13px; color:var(--text-3); }
    .co-pending { padding:24px; border:1px solid var(--border); border-radius:var(--radius); color:var(--text-2); font-size:14px; line-height:1.6; text-align:center; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand"><div class="brand-mark">🍅</div><span>Dopamodoro</span></a>
      <a href="index.html#pricing" class="co-back" style="margin:0">← Back to pricing</a>
    </div>
  </header>

  <div class="checkout-wrap">
    <h2 style="text-align:left;font-size:24px;margin-bottom:6px" id="coTitle">Complete your upgrade</h2>
    <p style="color:var(--text-3);font-size:14px;margin-bottom:22px">Secure checkout via Paddle. Instant access.</p>

    <div class="co-card">
      <div class="co-head">
        <div class="co-name" id="coName">Pro</div>
        <div class="co-price"><span class="per">$</span><span id="coPrice">6.99</span><span class="per" id="coPeriod">/month</span></div>
      </div>
      <div class="co-note" id="coNote"></div>
    </div>

    <div class="co-pay-note">🔒 Billed securely by <strong>Paddle</strong>. Your statement shows <strong>PADDLE* TIGERBESTB</strong></div>

    <div class="paddle-checkout-container" style="width:100%;min-width:312px"></div>

    <div class="co-trust">
      <div>🔒 SSL via Paddle</div>
      <div>🛡️ 7-day refund</div>
      <div>⚡ Instant access</div>
    </div>
  </div>

  <script>
    // Public Paddle client-side token. Secret API keys must never be placed here.
    var PADDLE_TOKEN = 'live_fdc940732c5e24247a4132b2e80';
    var plans = {
      pro: {
        name: 'Pro',
        monthly: { price: '3.99', period: '/month', priceId: 'pri_01kzbwx69dtmdc0mft9kzcw0a4' },
        annual:  { price: '29.99', period: '/year', priceId: 'pri_01kzbwx6mtdyd3xaf43zq2mbyz', note: 'Just $2.50/mo, billed yearly (Save 37%)' }
      },
      lifetime: {
        name: 'Lifetime',
        once: { price: '59', period: ' one-time', priceId: 'pri_01kzbwx6zx107p47keqcmyxn24', note: 'Pay once. Yours forever.' }
      }
    };

    var params = new URLSearchParams(window.location.search);
    var planKey = plans[params.get('plan')] ? params.get('plan') : 'pro';
    var plan = plans[planKey];
    var billing = (params.get('billing') === 'annual') ? 'annual' : 'monthly';
    var cycle = planKey === 'lifetime' ? plan.once : plan[billing];

    document.getElementById('coName').textContent = plan.name;
    document.getElementById('coPrice').textContent = cycle.price;
    document.getElementById('coPeriod').textContent = cycle.period;
    document.getElementById('coTitle').textContent = 'Upgrade to ' + plan.name;
    document.title = plan.name + ' — Dopamodoro';
    if (cycle.note) document.getElementById('coNote').textContent = cycle.note;

    var configured = PADDLE_TOKEN.indexOf('PASTE_') !== 0 && cycle.priceId.indexOf('PASTE_') !== 0;

    if (!configured) {
      document.querySelector('.paddle-checkout-container').innerHTML =
        '<div class="co-pending">Checkout is being finalized. Please email <a href="mailto:support@tigerbrandsglobal.com">support@tigerbrandsglobal.com</a> and we will get you set up right away.</div>';
    } else {
      Paddle.Initialize({
        token: PADDLE_TOKEN,
        eventCallback: function (event) {
          if (event && event.name === 'checkout.completed') {
            window.location.href = 'success.html';
          }
        }
      });
      Paddle.Checkout.open({
        settings: {
          displayMode: 'inline',
          frameTarget: 'paddle-checkout-container',
          frameInitialHeight: 450,
          frameStyle: 'width:100%;min-width:312px;background-color:transparent;'
        },
        customData: { product: 'dopamodoro', plan: planKey, billing: billing },
        items: [{ priceId: cycle.priceId, quantity: 1 }]
      });
    }
  </script>
</body>
</html>
