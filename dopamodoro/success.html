<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment complete — Dopamodoro</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .success-wrap { max-width: 560px; margin: 72px auto; padding: 24px; text-align: center; }
    .success-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 34px 28px; }
    .success-icon { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 50%; background: rgba(34,197,94,.12); color: #4ade80; font-size: 30px; }
    .success-card h1 { font-size: 27px; margin-bottom: 10px; }
    .success-card p { color: var(--text-2); line-height: 1.65; }
    .success-help { margin-top: 20px; font-size: 13px; color: var(--text-3); }
  </style>
</head>
<body>
  <main class="success-wrap">
    <section class="success-card">
      <div class="success-icon">✓</div>
      <h1>Payment complete</h1>
      <p>Welcome to Dopamodoro Pro. Paddle will email your receipt to the address used at checkout.</p>
      <p class="success-help">Need help with activation? Email <a href="mailto:support@tigerbrandsglobal.com">support@tigerbrandsglobal.com</a>.</p>
      <a class="btn-primary" href="index.html" style="display:inline-block;margin-top:22px">Back to Dopamodoro</a>
    </section>
  </main>
</body>
</html>
