<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Funnel control plane</title><style>body{font:14px system-ui;background:#0b1020;color:#eaf0ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:32px}input,select,button,textarea{background:#151d33;color:#fff;border:1px solid #354363;border-radius:7px;padding:9px}button{cursor:pointer;background:#526cff}header,.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}.card,section{background:#11182b;border:1px solid #26334f;border-radius:12px;padding:16px}.value{font-size:26px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #26334f}.warn{color:#ffc36a}textarea{width:100%;min-height:260px;box-sizing:border-box}</style></head><body><div class="wrap"><header><h1>Funnel analytics</h1><span id="status">Not connected</span></header><div class="filters"><input id="api" placeholder="Worker URL"><input id="token" type="password" placeholder="Admin token (session only)"><input id="from" type="date"><input id="to" type="date"><input id="funnel" value="replymind-main" placeholder="Funnel"><input id="campaign" placeholder="Campaign"><input id="source" placeholder="Source"><button id="load">Load</button></div><p class="warn" id="fresh"></p><div class="cards" id="cards"></div><section><h2>Variant comparison</h2><table><thead><tr><th>Variant</th><th>Exposure</th><th>Purchase</th><th>Conversion</th><th>Revenue*</th><th>Refunds</th><th>CAC*</th></tr></thead><tbody id="rows"></tbody></table><small>* Monetary values are minor units. Never combine currencies.</small></section><section><h2>Funnel editor</h2><p>Edit/reorder steps by changing their positions. IDs remain stable through publication.</p><textarea id="definition">{"id":"replymind-main","property_id":"replymind","name":"ReplyMind main funnel","status":"draft","steps":[{"id":"advertorial","name":"Advertorial","position":1,"kind":"advertorial","path":"/"},{"id":"sales","name":"Sales","position":2,"kind":"sales","path":"/"},{"id":"checkout","name":"Checkout","position":3,"kind":"checkout","path":"/checkout.html"},{"id":"success","name":"Success","position":4,"kind":"success","path":"/success.html"}],"experiments":[]}</textarea><button id="save">Save funnel</button><button id="publish">Publish</button></section></div><script>const $=x=>document.getElementById(x),now=new Date();$('to').value=now.toISOString().slice(0,10);$('from').value=new Date(now-29*864e5).toISOString().slice(0,10);$('api').value=localStorage.rmAnalyticsApi||'';function auth(){sessionStorage.rmAdminToken=$('token').value||sessionStorage.rmAdminToken||'';localStorage.rmAnalyticsApi=$('api').value;return{authorization:'Bearer '+sessionStorage.rmAdminToken,'content-type':'application/json'}}async function load(){let q=new URLSearchParams({from:$('from').value,to:$('to').value,funnel_id:$('funnel').value});if($('campaign').value)q.set('campaign',$('campaign').value);if($('source').value)q.set('source',$('source').value);let r=await fetch($('api').value+'/v1/metrics?'+q,{headers:auth()}),x=await r.json();if(!r.ok)throw Error(x.error);$('status').textContent='Connected';$('fresh').textContent='Events fresh: '+(x.freshness.events||'none')+' · Ad costs fresh: '+(x.freshness.ad_costs||'not configured');let totals=x.variants.reduce((a,v)=>({visits:a.visits+v.visits,purchases:a.purchases+v.purchases,revenue:a.revenue+v.revenue_minor}),{visits:0,purchases:0,revenue:0});$('cards').innerHTML=[['Visits',totals.visits],['Purchases',totals.purchases],['Overall',totals.visits?(100*totals.purchases/totals.visits).toFixed(2)+'%':'—'],['Net revenue*',totals.revenue]].map(c=>`<div class=card><div>${c[0]}</div><div class=value>${c[1]}</div></div>`).join('');$('rows').innerHTML=x.variants.map(v=>`<tr><td>${v.variant_id}</td><td>${v.unique_visitors}</td><td>${v.purchases}</td><td>${v.overall_conversion_pct??'—'}%</td><td>${v.revenue_minor}</td><td>${v.refunds}</td><td>${v.cac_minor??'—'}</td></tr>`).join('')}async function save(publish){let x=JSON.parse($('definition').value);if(publish)x.status='published';let r=await fetch($('api').value+'/v1/funnels',{method:'PUT',headers:auth(),body:JSON.stringify(x)}),y=await r.json();if(!r.ok)throw Error(y.error);alert('Saved '+y.id+' as '+y.status)}$('load').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('save').onclick=()=>save(false);$('publish').onclick=()=>save(true);</script></body></html>
